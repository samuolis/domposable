config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  # Compose builds declarative trees; length and branch counts are poor complexity proxies.
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
    ignoreSingleWhenExpression: true
  LongParameterList:
    ignoreDefaultParameters: true
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview', 'Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Test', 'Immutable']
    excludes: ['**/*Test/**', '**/test/**', '**/*.kts']
  ReturnCount:
    excludeGuardClauses: true
  MaxLineLength:
    excludeCommentStatements: true
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
