site_name: Domposable
site_description: One Compose API for apps and semantic HTML
site_url: https://samuolis.github.io/domposable/
repo_url: https://github.com/samuolis/domposable
theme:
  name: material
  logo: assets/brand/icon.svg
  favicon: assets/brand/icon.svg
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features: [navigation.tabs, content.code.copy]
nav:
  - Home: index.md
  - Guides:
      - Get started: getting-started.md
      - How the API works: how-it-works.md
      - Components: components.md
      - Design systems: design-systems.md
      - Adaptive layouts: adaptive.md
      - Screens and navigation: screens.md
      - Navigation recipes and URLs: recipes.md
      - Integrations: integrations.md
      - Architecture: architecture.md
      - Migration: migration.md
      - Compatibility and coverage: compatibility.md
      - Component coverage: coverage.md
  - Examples:
      - Shopping app: shopping.md
      - Modular app and injection: modular-demo.md
      - Compare HTML and Wasm: compare.md
      - Playground: https://samuolis.github.io/domposable/demo/
      - Storefront: https://samuolis.github.io/domposable/shop/
  - API: https://samuolis.github.io/domposable/api/
  - Contributing:
      - Validation and visual review: validation.md
      - Release maintenance: releasing.md
      - Roadmap: roadmap.md
      - Brand assets: brand.md
markdown_extensions: [admonition, tables, fenced_code]
