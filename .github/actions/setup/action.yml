name: Build toolchain
description: Pinned public-library toolchain
runs:
  using: composite
  steps:
    - name: Use the primary Ubuntu package archive
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
        fi
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # Reuse this PR's incremental cache on retries; forks remain read-only.
        cache-read-only: ${{ github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        cmdline-tools-version: '15859902'
        packages: 'platform-tools platforms;android-37.2 build-tools;36.0.0'
        log-accepted-android-sdk-licenses: false
    - name: Documentation dependencies
      shell: bash
      run: python -m pip install --requirement docs/requirements.txt
