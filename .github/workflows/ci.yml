name: CI
on:
  pull_request:
  push:
    branches: [main, 'release-candidate/**']
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: 'Export visual candidates for review; this run cannot satisfy CI passed'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.record_screenshots || false }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Workflow and patch checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Lint workflows with pinned actionlint
        # GitHub's supported concurrency.queue field is newer than this linter.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Check patch whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=HEAD; fi
          git diff --check "$BASE" HEAD
  quality:
    name: Kotlin quality, Android lint and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup
      - name: Check formatting, static analysis, Android lint and coverage floors
        run: xvfb-run -a ./gradlew qualityCheck --continue --console=plain
      - name: Summarize measured coverage
        if: always()
        run: python scripts/ci/coverage_report.py build/reports/coverage/coverage.xml --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-and-coverage
          path: |
            build/reports/ktlint/
            build/reports/detekt/
            build/reports/coverage/
            **/build/reports/lint*
            **/build/reports/tests/
          retention-days: 30
  portable:
    name: Build and packaged web validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup
      - run: python -m unittest discover -s scripts/tests -v
      - run: xvfb-run -a ./gradlew jvmTest :domposable-ui:jsBrowserTest :domposable-design-material:jsBrowserTest :domposable-navigation3:jsBrowserTest :demo:testAndroidHostTest :domposable-design-material:testAndroidHostTest :androidApp:assembleDebug :metro-example:compileKotlinJs :metro-example:compileKotlinWasmJs :kobweb-example:compileKotlinJs :koin-example:compileKotlinJs :koin-example:compileKotlinWasmJs dokkaGenerate --continue --console=plain
      - name: Export compiled references for review
        run: python scripts/ci/api_reference.py --output-dir build/generated-reference
      - name: Verify the Android demo version derived from SemVer
        run: python scripts/ci/sign_release.py --verify-debug
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Export the complete Kobweb application and test its static routes
        run: |
          python scripts/ci/kobweb_export.py
          npx playwright test --config playwright.integrations.config.ts
      - run: ./gradlew :demo:jsBrowserDistribution :demo:wasmJsBrowserDistribution --console=plain
      - run: python scripts/ci/build_site.py
      - name: Verify fingerprinted production HTML and Wasm distributions
        run: npx playwright test --config playwright.production.config.ts
      - name: Verify component and modifier reference matches the compiled API
        run: python scripts/ci/api_reference.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-build-evidence
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            test-results/
            playwright-report/
            production-test-results/
            integration-test-results/
            integration-playwright-report/
            build/integration-captures/
            kobweb-example/.kobweb/site/
            playwright-production-report/
            build/site/
            build/generated-reference/
            build/screenshots/
            build/visual-report/
            build/renderer-comparison/
            build/renderer-report/
            build/benchmarks/
            build/accessibility/
            **/build/reports/tests/
          retention-days: 30
  preview:
    name: Build shared browser preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup
      - run: ./gradlew :demo:jsBrowserDevelopmentWebpack :demo:wasmJsBrowserDevelopmentWebpack --console=plain
      - run: python scripts/ci/browser_preview.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-preview
          path: build/browser-preview/
          retention-days: 1
          if-no-files-found: error
  browser:
    name: Browser tests (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chromium, shard: 1, total: 6}
          - {browser: chromium, shard: 2, total: 6}
          - {browser: chromium, shard: 3, total: 6}
          - {browser: chromium, shard: 4, total: 6}
          - {browser: chromium, shard: 5, total: 6}
          - {browser: chromium, shard: 6, total: 6}
          - {browser: firefox, shard: 1, total: 1}
          - {browser: webkit, shard: 1, total: 1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-preview
          path: build/browser-preview
      - name: Install the assigned browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$apt_source"
            fi
          done
          npx playwright install --with-deps "$BROWSER"
      - name: Run the assigned browser shard
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.total }}
        run: npx playwright test --project="$BROWSER" --shard="$SHARD/$SHARDS" --workers=2 --reporter=list,github,blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-shard-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
            build/screenshots/
            build/renderer-comparison/
            build/benchmarks/
            build/accessibility/
          retention-days: 30
          if-no-files-found: error
  portable-evidence:
    name: Android, desktop, DOM and Wasm
    if: ${{ !cancelled() }}
    needs: [portable, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - run: npm ci
      - run: python -m pip install --requirement docs/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: portable-build-evidence}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: browser-shard-*
          merge-multiple: true
      - name: Merge all browser reports
        if: always()
        run: npx playwright merge-reports --reporter=html blob-report
      - name: Export direct HTML and Compose UI theme comparisons
        if: always()
        run: python scripts/ci/renderer_comparison.py
      - name: Compare or export reviewed-platform visual captures
        if: always()
        env:
          RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: |
          status=0
          for platform in android desktop dom wasm; do
            if [ "$RECORD" = true ]; then
              python scripts/ci/screenshots.py "$platform" --record || status=1
            else
              python scripts/ci/screenshots.py "$platform" || status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-html-evidence
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            test-results/
            playwright-report/
            production-test-results/
            integration-test-results/
            integration-playwright-report/
            build/integration-captures/
            kobweb-example/.kobweb/site/
            playwright-production-report/
            build/site/
            build/generated-reference/
            build/screenshots/
            build/visual-report/
            build/renderer-comparison/
            build/renderer-report/
            build/benchmarks/
            build/accessibility/
            **/build/reports/tests/
          retention-days: 30
      - name: Require build and every browser shard
        if: always()
        env:
          BUILD: ${{ needs.portable.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$BUILD" = success && test "$BROWSER" = success
  binary-api:
    name: Binary API compatibility
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/setup
      - name: Validate every published JVM, Android, JS, Wasm and iOS ABI
        run: ./gradlew binaryApiCheck -Pdomposable.abi.strict=true --continue --console=plain
      - name: Report baseline changes against the PR base and latest ancestor release
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=HEAD; fi
          python scripts/ci/binary_api.py --base "$BASE" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: binary-api
          path: |
            build/reports/binary-api/
            **/build/reports/abi/
            **/build/kotlin/abi/
            domposable-*/api/
          retention-days: 30
          if-no-files-found: error
  consumers:
    name: Published consumers on six targets
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup
      - run: ./gradlew publishAllPublicationsToFixtureRepository :demo:compileKotlinIosArm64 :demo:compileKotlinIosSimulatorArm64 :metro-example:compileAndroidMain :metro-example:compileKotlinIosArm64 :metro-example:compileKotlinIosSimulatorArm64 :koin-example:compileAndroidMain :koin-example:compileKotlinIosArm64 :koin-example:compileKotlinIosSimulatorArm64 --console=plain
      - run: python scripts/ci/package_publications.py --unsigned
      - name: Resolve and compile published artifacts on all six targets
        run: ./gradlew :consumer-fixture:compileKotlinJvm :consumer-fixture:compileKotlinJs :consumer-fixture:compileKotlinWasmJs :consumer-fixture:compileAndroidMain :consumer-fixture:compileKotlinIosArm64 :consumer-fixture:compileKotlinIosSimulatorArm64 :custom-provider-fixture:compileKotlinJvm :custom-provider-fixture:compileKotlinJs :custom-provider-fixture:compileKotlinWasmJs :custom-provider-fixture:compileAndroidMain :custom-provider-fixture:compileKotlinIosArm64 :custom-provider-fixture:compileKotlinIosSimulatorArm64 :koin-example:compileKotlinJvm :koin-example:compileKotlinJs :koin-example:compileKotlinWasmJs :koin-example:compileAndroidMain :koin-example:compileKotlinIosArm64 :koin-example:compileKotlinIosSimulatorArm64 -Pdomposable.consumer.repository="$PWD/build/repository" --refresh-dependencies --console=plain
      - name: Verify stable Compose core in every packaged consumer target
        run: ./gradlew :consumer-fixture:verifyStableComposeBaseline -Pdomposable.consumer.repository="$PWD/build/repository" --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: published-consumer-evidence
          include-hidden-files: true
          path: |
            .release/artifacts/maven-bundle.zip
            **/build/reports/tests/
          retention-days: 30
  passed:
    name: CI passed
    if: always()
    needs: [hygiene, quality, portable, preview, browser, portable-evidence, consumers, binary-api]
    runs-on: ubuntu-24.04
    steps:
      - name: Require validation and prevent recording from satisfying branch or release gates
        env:
          HYGIENE: ${{ needs.hygiene.result }}
          QUALITY: ${{ needs.quality.result }}
          PORTABLE: ${{ needs.portable.result }}
          PREVIEW: ${{ needs.preview.result }}
          BROWSER: ${{ needs.browser.result }}
          EVIDENCE: ${{ needs.portable-evidence.result }}
          CONSUMERS: ${{ needs.consumers.result }}
          BINARY_API: ${{ needs.binary-api.result }}
          RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: test "$HYGIENE" = success && test "$QUALITY" = success && test "$PORTABLE" = success && test "$BROWSER" = success && test "$PREVIEW" = success && test "$EVIDENCE" = success && test "$CONSUMERS" = success && test "$BINARY_API" = success && test "$RECORD" != true
