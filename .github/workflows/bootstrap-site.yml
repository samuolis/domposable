name: Publish bootstrap website
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: domposable-release
  queue: max
jobs:
  website:
    if: github.repository == 'samuolis/domposable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Require successful CI for the unpublished bootstrap
        id: ci
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from version import read_version
          version, build = read_version(Path('version.properties'))
          if str(version) != '0.0.0' or build != 0:
              raise SystemExit('Released websites must use Bump and release.')
          sha = os.environ['GITHUB_SHA']
          runs = json.loads(subprocess.check_output(['gh', 'api', f'repos/samuolis/domposable/actions/workflows/ci.yml/runs?head_sha={sha}&branch=main&status=success&per_page=100']))['workflow_runs']
          run = next((r for r in runs if r['head_sha'] == sha and r['event'] == 'push' and r['conclusion'] == 'success'), None)
          if run is None: raise SystemExit('Wait for main CI to pass before publishing the bootstrap website.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={run['id']}\n")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-html-evidence
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify website provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          site = Path('build/site')
          metadata = json.loads((site / 'release.json').read_text())
          if metadata != {'version': '0.0.0', 'build': 0, 'commit': os.environ['GITHUB_SHA'], 'status': 'preview'}:
              raise SystemExit('Website does not match this unpublished bootstrap commit.')
          for path in ['index.html', 'api/index.html', 'demo/index.html', 'wasm/index.html', 'compare/index.html', 'routes/tasks/welcome/index.html', 'shop/products/canvas-weekender/index.html', 'components/index.html']:
              if not (site / path).is_file(): raise SystemExit('Incomplete website: ' + path)
          PY
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: {path: build/site}
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: pages
